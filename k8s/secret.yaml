# DO NOT commit this file with real values.
# Populate with: kubectl create secret generic trading-agent-secrets \
#   --from-env-file=.env -n trading-agent
# Or use your cloud provider's secret manager (GCP Secret Manager, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: trading-agent-secrets
  namespace: trading-agent
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  ALPACA_API_KEY: "REPLACE_ME"
  ALPACA_SECRET_KEY: "REPLACE_ME"
  POLYGON_API_KEY: "REPLACE_ME"
